<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0d0c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f5f0" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Larder" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Larder — track your fridge, freezer and pantry, plan meals, and cut food waste." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <!-- Safari won't use an SVG for the home-screen icon; it needs a PNG. -->
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <title>Larder</title>
    <script>
      // Resolve theme and layout before first paint, so the app doesn't flash
      // the wrong one while React boots.
      (function () {
        try {
          var root = document.documentElement
          var theme = localStorage.getItem('larder-theme')
          if (theme === 'light' || theme === 'dark') root.dataset.theme = theme
          var mode = localStorage.getItem('larder-layout') || 'auto'
          root.dataset.layout =
            mode === 'auto' ? (window.innerWidth >= 940 ? 'wide' : 'compact') : mode
        } catch (e) {
          document.documentElement.dataset.layout =
            window.innerWidth >= 940 ? 'wide' : 'compact'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
