<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0d0c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f5f0" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Larder" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Larder — track your fridge, freezer and pantry, plan meals, and cut food waste." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <!-- Safari won't use an SVG for the home-screen icon; it needs a PNG. -->
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <title>Larder</title>
    <script>
      // Self-heal a stale index.html.
      //
      // Pages serves this file with a ten-minute cache but replaces the hashed
      // bundles on every deploy, deleting the old ones. Deploy twice inside that
      // window and a device can be left holding an index.html whose script now
      // 404s — nothing boots, with no error the user can see or act on. Catch
      // the failed load and re-fetch the page past the cache, once.
      (function () {
        var KEY = 'larder-recovering'
        window.addEventListener(
          'error',
          function (e) {
            var el = e.target
            if (!el || (el.tagName !== 'SCRIPT' && el.tagName !== 'LINK')) return
            try {
              // Guard against a reload loop when the network is simply down.
              if (sessionStorage.getItem(KEY)) return
              sessionStorage.setItem(KEY, '1')
            } catch (err) {
              // Private mode has no sessionStorage; one attempt still beats none.
            }
            location.replace(location.pathname + '?rev=' + Date.now() + location.hash)
          },
          // Resource errors don't bubble, so this has to listen on capture.
          true,
        )
      })()
    </script>

    <script>
      // Resolve theme and layout before first paint, so the app doesn't flash
      // the wrong one while React boots.
      (function () {
        try {
          var root = document.documentElement
          var theme = localStorage.getItem('larder-theme')
          if (theme === 'light' || theme === 'dark') root.dataset.theme = theme
          var mode = localStorage.getItem('larder-layout') || 'auto'
          root.dataset.layout =
            mode === 'auto' ? (window.innerWidth >= 940 ? 'wide' : 'compact') : mode
        } catch (e) {
          document.documentElement.dataset.layout =
            window.innerWidth >= 940 ? 'wide' : 'compact'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
